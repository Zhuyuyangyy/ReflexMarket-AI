# ReflexMarket-AI Docker Compose
# Multi-service orchestration for development and production

version: "3.9"

services:
  # ── API Server ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reflexmarket-api
    ports:
      - "8020:8020"
    environment:
      - PYTHONPATH=/app:/app/backend/app
      - PORT=8020
      - LOG_LEVEL=info
    volumes:
      - ./backend:/app/backend:ro
      - ./src:/app/src:ro
      - ./frontend:/app/frontend:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reflexmarket-net

  # ── Frontend (Static) ──────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: reflexmarket-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - reflexmarket-net

  # ── Test Runner ────────────────────────────────────────────────
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reflexmarket-test
    environment:
      - PYTHONPATH=/app:/app/backend/app
    volumes:
      - ./tests:/app/tests:ro
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    profiles:
      - testing
    networks:
      - reflexmarket-net

networks:
  reflexmarket-net:
    driver: bridge
